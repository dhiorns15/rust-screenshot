name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $zip = "rsnip-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path target/release/rsnip.exe, README.md, LICENSE -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV
      - run: installer/build.ps1
        shell: pwsh
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem target/installer/*-setup.exe).FullName target/release/rsnip.exe $env:ZIP --title "RSnip $env:GITHUB_REF_NAME" --generate-notes

  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "rsnip-$GITHUB_REF_NAME-linux-x64.tar.gz" -C target/release rsnip -C "$GITHUB_WORKSPACE" README.md LICENSE
          gh release upload "$GITHUB_REF_NAME" "rsnip-$GITHUB_REF_NAME-linux-x64.tar.gz"
