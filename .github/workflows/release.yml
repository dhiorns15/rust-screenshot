name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes list every commit since the previous tag.
          fetch-depth: 0
      # vX.Y.Z releases version X.Y.Z; vX.Y.Z-rcN is a release candidate of it (see CONTRIBUTING.md).
      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          case "$GITHUB_REF_NAME" in
            "v$version" | "v$version"-rc[0-9]*) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml (want v$version or v$version-rcN)"; exit 1 ;;
          esac
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
        env:
          # Also writes target/release/rsnip.pdb, published below so the addresses in Windows crash
          # reports can be looked up. The exe only names the file, not the path it was built in.
          CARGO_PROFILE_RELEASE_STRIP: none
      - name: Package
        shell: pwsh
        run: |
          $zip = "rsnip-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path target/release/rsnip.exe, README.md, LICENSE -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV
      - run: installer/build.ps1
        shell: pwsh
      - name: Release notes
        shell: bash
        run: bash ci/release-notes.sh "$GITHUB_REF_NAME" > notes.md && cat notes.md
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @((Get-ChildItem target/installer/*-setup.exe).FullName, "target/release/rsnip.exe", $env:ZIP)
          # Only for looking up crash report addresses, so a release goes out without it if need be.
          if (Test-Path target/release/rsnip.pdb) { $files += "target/release/rsnip.pdb" } else { Write-Warning "No rsnip.pdb to publish" }
          # A release candidate is a pre-release: GitHub doesn't list it as the latest release, which
          # is what RSnip's update check asks for, so only people who download it get it.
          $options = @('--title', "RSnip $env:GITHUB_REF_NAME", '--notes-file', 'notes.md')
          if ($env:GITHUB_REF_NAME.Contains('-')) { $options += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @files @options

  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: cargo build --release
      # The .deb and .rpm, checked by installing them on Ubuntu, Fedora and openSUSE.
      - run: installer/linux/build-packages.sh
      - run: ci/test-packages.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/rsnip
          cp target/release/rsnip installer/linux/install.sh README.md LICENSE dist/rsnip/
          chmod 755 dist/rsnip/rsnip dist/rsnip/install.sh
          tar -czf "rsnip-$GITHUB_REF_NAME-linux-x64.tar.gz" -C dist rsnip
          gh release upload "$GITHUB_REF_NAME" "rsnip-$GITHUB_REF_NAME-linux-x64.tar.gz" target/debian/*.deb target/generate-rpm/*.rpm

  # Updates the previous release to this one with `rsnip --update`, as users' copies will.
  update:
    needs: release
    # The update check doesn't offer release candidates, so there's nothing to update to.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: installer/update-test.ps1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
