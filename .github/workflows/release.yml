name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes list every commit since the previous tag.
          fetch-depth: 0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
        env:
          # Also writes target/release/rsnip.pdb, published below so the addresses in Windows crash
          # reports can be looked up. The exe only names the file, not the path it was built in.
          CARGO_PROFILE_RELEASE_STRIP: none
      - name: Package
        shell: pwsh
        run: |
          $zip = "rsnip-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path target/release/rsnip.exe, README.md, LICENSE -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV
      - run: installer/build.ps1
        shell: pwsh
      - name: Release notes
        shell: bash
        run: bash ci/release-notes.sh "$GITHUB_REF_NAME" > notes.md && cat notes.md
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem target/installer/*-setup.exe).FullName target/release/rsnip.exe target/release/rsnip.pdb $env:ZIP --title "RSnip $env:GITHUB_REF_NAME" --notes-file notes.md

  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/rsnip
          cp target/release/rsnip installer/linux/install.sh README.md LICENSE dist/rsnip/
          chmod 755 dist/rsnip/rsnip dist/rsnip/install.sh
          tar -czf "rsnip-$GITHUB_REF_NAME-linux-x64.tar.gz" -C dist rsnip
          gh release upload "$GITHUB_REF_NAME" "rsnip-$GITHUB_REF_NAME-linux-x64.tar.gz"

  # Updates the previous release to this one with `rsnip --update`, as users' copies will.
  update:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: installer/update-test.ps1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
