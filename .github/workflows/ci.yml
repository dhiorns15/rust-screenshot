name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Package the debug build to check the installer builds, installs, upgrades and uninstalls.
      - run: cargo build
      - run: installer/build.ps1 -Bin ..\target\debug
        shell: pwsh
      - run: installer/smoke-test.ps1
        shell: pwsh

  # GitHub shows a blank issue, not the form, when it can't read an issue form.
  issue-forms:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -c 'import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]' .github/ISSUE_TEMPLATE/*.yml

  # The library and editor build on Linux too. This job also runs the pixel snapshot tests, in the
  # same environment as ci/Dockerfile (a software GPU and the DejaVu font), so they match locally.
  linux:
    runs-on: ubuntu-24.04
    container: rust:1.97.1
    steps:
      - uses: actions/checkout@v7
      - name: Install the software GPU, fonts, Tesseract, GStreamer and desktop services (as in ci/Dockerfile)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 fonts-dejavu-core fontconfig tesseract-ocr \
            gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-pipewire \
            dbus pipewire pipewire-bin wireplumber xdg-desktop-portal xvfb xclip
          rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Recording, the background icon and copying files against real desktop services
      # (xdg-desktop-portal, PipeWire, Xvfb), with stand-ins for GNOME's picker, the panel and notifications.
      - run: ci/desktop-test.sh
      # Random input against the editor for a while; the log prints the seed to replay a failure.
      - run: cargo test panic_hunt_long -- --ignored --nocapture
      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-diffs
          path: |
            tests/snapshots/*.new.png
            tests/snapshots/*.diff.png
          if-no-files-found: ignore

  # The desktop tests again, against what Ubuntu 24.04 LTS ships: PipeWire 1.0 and GStreamer 1.24,
  # where the linux job has Debian 13's PipeWire 1.4 and GStreamer 1.26. They behave differently
  # enough that passing on one says little about the other.
  desktop-ubuntu:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7
      - name: Install a C linker, GStreamer, the desktop services and rustup
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential curl ca-certificates \
            gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-pipewire \
            dbus pipewire pipewire-bin wireplumber xdg-desktop-portal xvfb xclip
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: ci/desktop-test.sh

  # Pushing to real S3, WebDAV, SFTP, FTPS and SMB servers, in Docker (ci/test-destinations.sh); the linux
  # job's container can't start containers of its own.
  destinations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: ci/test-destinations.sh

  # The .deb and .rpm build, install with what they depend on and recommend on Ubuntu, Fedora and
  # openSUSE, and run (installer/linux/build-packages.sh, ci/test-packages.sh).
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: cargo build --release
      - run: installer/linux/build-packages.sh
      - run: ci/test-packages.sh
