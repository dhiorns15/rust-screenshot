name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Package the debug build to check the installer builds, installs, upgrades and uninstalls.
      - run: cargo build
      - run: installer/build.ps1 -Bin ..\target\debug
        shell: pwsh
      - run: installer/smoke-test.ps1
        shell: pwsh

  # The library and editor build on Linux too. This job also runs the pixel snapshot tests, in the
  # same environment as ci/Dockerfile (a software GPU and the DejaVu font), so they match locally.
  linux:
    runs-on: ubuntu-latest
    container: rust:1.97.1
    steps:
      - uses: actions/checkout@v4
      - name: Install the software GPU and fonts (as in ci/Dockerfile)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 fonts-dejavu-core fontconfig
          rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: |
            tests/snapshots/*.new.png
            tests/snapshots/*.diff.png
          if-no-files-found: ignore
