# Monthly pull requests for newer GitHub Actions and crates. Crates that only work at the same
# version as each other (egui's, the windows crates) come together; the rest's minor and patch
# updates come in one pull request, and any other major update gets its own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      egui:
        # egui-phosphor (the icons) is only released for an egui version some time after it.
        patterns: [egui, egui_*, egui-phosphor, eframe]
      windows:
        patterns: [windows, windows-core]
      minor-and-patch:
        update-types: [minor, patch]
