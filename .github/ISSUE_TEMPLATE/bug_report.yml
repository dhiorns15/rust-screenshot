name: Bug report
description: Something in RSnip doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The quickest way to fill in the details below is
        **Settings → System info → Report a problem** in RSnip: it copies everything this needs about
        your system (no screenshots or file names) and opens this page.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        I pressed Print Screen with two monitors, dragged across both, and the capture only had the left one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      description: If you can. "Every time" or "once, out of the blue" helps too.
      placeholder: |
        1. ...
        2. ...
  - type: dropdown
    id: area
    attributes:
      label: Part of RSnip
      options:
        - Capturing (region, window, all screens, scrolling, text)
        - Recording
        - Editor
        - Video player and trimming
        - Library and search
        - Push to other places (SFTP, S3, SMB, Slack, Immich, a custom uploader...)
        - Settings or shortcuts
        - Tray app or background icon
        - Updates or installing
        - Something else
    validations:
      required: true
  - type: input
    id: destination
    attributes:
      label: Where it pushes to
      description: Push to problems only. The kind and the service, e.g. "S3-compatible, Backblaze B2" or "Immich 2.1". Never paste passwords, keys or webhook addresses.
  - type: textarea
    id: system-info
    attributes:
      label: System info
      description: Paste from Settings → System info → Copy (or Report a problem, which copies it for you). If RSnip won't open, give your RSnip version, OS and desktop (e.g. Ubuntu 24.04, GNOME, Wayland).
      render: text
    validations:
      required: true
  - type: textarea
    id: crash
    attributes:
      label: Crash report
      description: If RSnip closed unexpectedly, Settings → System info → Report this crash copies it.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a recording
      description: Drag them in here, if they show the problem. Check they don't show anything private.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I'm on the latest version (Settings → Updates → Check now), or I've said which one I'm on.
          required: true
        - label: I looked through the open issues and this isn't one of them.
          required: true
