[package]
name = "rsnip"
version = "0.8.0"
edition = "2021"
description = "A Snagit-style screenshot tool: capture, a searchable screenshot library and editor, and screen recording"
license = "MIT"
repository = "https://github.com/dhiorns15/rust-screenshot"

[features]
# Lets tools see and drive the library window: run a build with this feature with EGUI_INSPECTION=1
# and it serves its UI tree on localhost:5719 (see CONTRIBUTING.md). Never in releases.
inspect = ["eframe/inspection"]

[build-dependencies]
embed-resource = "3"
png = "0.18"

[dependencies]
ab_glyph = "0.2"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.36", default-features = false, features = ["serde"] }
egui-phosphor = "0.14"
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny-skia = "0.12"
# Uploads to other places (see src/push): HTTP with rustls and the system's certificates.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# FTPS (see src/push/ftps.rs), over the same rustls, with the system's certificates or a trusted one.
# "deprecated" is for implicit TLS (port 990).
suppaftp = { version = "12", default-features = false, features = ["rustls-ring", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"

# Capture, tray, OCR, pinning and recording: Windows only.
[target.'cfg(windows)'.dependencies]
png = "0.18"
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Media_MediaFoundation"] }
# What windows' #[implement] (dragging files out of the library) names; it moves with windows.
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WNet",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# The library and editor on Linux and other Unix desktops.
[target.'cfg(not(windows))'.dependencies]
# The tray icon (StatusNotifierItem), without pulling in tokio.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
# The screen-cast portal and notifications, on the same D-Bus library as the tray icon.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
eframe = { version = "0.36", default-features = false, features = ["x11", "wayland"] }
libc = "0.2"
# Copying files to the clipboard in every format a file manager or chat reads (arboard has one).
x11rb = "0.14"
trash = "5"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
proptest = "1"

# Pixel snapshots render on a GPU, so they run on Linux with a software one (ci/Dockerfile).
[target.'cfg(target_os = "linux")'.dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "snapshot", "wgpu"] }

[profile.release]
lto = true
codegen-units = 1
# Keeps function names, so Linux crash reports have a backtrace (Windows keeps its symbols in a
# .pdb file, which the release workflow builds and publishes separately).
strip = "debuginfo"

# The Linux packages, built by installer/linux/build-packages.sh from a release build: a .deb
# (cargo-deb) and an .rpm (cargo-generate-rpm). The libraries RSnip loads as it starts are
# required; what recording, reading text and opening folders use is recommended, so it's installed
# too unless turned off. RPM names come as alternatives, for Fedora's and openSUSE's names.
[package.metadata.deb]
maintainer = "dhiorns15 <dhiorns15@users.noreply.github.com>"
copyright = "RSnip contributors"
license-file = ["LICENSE", "0"]
section = "graphics"
extended-description = """\
RSnip keeps your screenshots in a searchable library and lets you annotate them, and records the \
screen, a window or an area to MP4 or GIF."""
depends = "$auto, libegl1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libwayland-egl1, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrender1"
recommends = "xdg-utils, xdg-user-dirs, fontconfig, curl, smbclient, tesseract-ocr, gstreamer1.0-tools, gstreamer1.0-pipewire, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-ugly, gstreamer1.0-plugins-bad, gstreamer1.0-libav, pkexec | policykit-1"
suggests = "gnome-shell-extension-appindicator"
maintainer-scripts = "installer/linux/package/debian/"
assets = [
    ["target/release/rsnip", "usr/bin/", "755"],
    ["installer/linux/package/rsnip.desktop", "usr/share/applications/", "644"],
    ["installer/linux/package/rsnip.metainfo.xml", "usr/share/metainfo/io.github.dhiorns15.RSnip.metainfo.xml", "644"],
    ["target/linux-package/rsnip.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["README.md", "usr/share/doc/rsnip/", "644"],
]

[package.metadata.generate-rpm]
summary = "Screenshot library and editor, with screen recording"
pre_uninstall_script = "installer/linux/package/debian/prerm"
assets = [
    { source = "target/release/rsnip", dest = "/usr/bin/rsnip", mode = "755" },
    { source = "installer/linux/package/rsnip.desktop", dest = "/usr/share/applications/rsnip.desktop", mode = "644" },
    { source = "installer/linux/package/rsnip.metainfo.xml", dest = "/usr/share/metainfo/io.github.dhiorns15.RSnip.metainfo.xml", mode = "644" },
    { source = "target/linux-package/rsnip.png", dest = "/usr/share/icons/hicolor/256x256/apps/rsnip.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/rsnip/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/rsnip/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
"libEGL.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libXrender.so.1()(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
xdg-utils = "*"
xdg-user-dirs = "*"
fontconfig = "*"
curl = "*"
# Samba's smbclient, for pushing to SMB shares.
samba-client = "*"
"(tesseract or tesseract-ocr)" = ""
"(tesseract-langpack-eng or tesseract-ocr-traineddata-english)" = ""
"(gstreamer1 or gstreamer-utils)" = ""
"(pipewire-gstreamer or gstreamer-plugin-pipewire)" = ""
"(gstreamer1-plugins-good or gstreamer-plugins-good)" = ""
# Fedora's OpenH264 (its Cisco repository is on by default), else x264 from RPM Fusion or Packman.
"(gstreamer1-plugin-openh264 or gstreamer1-plugins-ugly or gstreamer-plugins-ugly)" = ""
# The H.264 parser every encoder needs before the MP4 muxer.
"(gstreamer1-plugins-bad-free or gstreamer-plugins-bad)" = ""
# An H.264 decoder, to play recordings in the library (OpenH264's, above, is one too).
"(gstreamer1-plugin-libav or gstreamer-plugins-libav)" = ""
# pkexec, which asks for the password to install an update from Settings.
polkit = "*"
