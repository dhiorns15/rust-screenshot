[package]
name = "rsnip"
version = "0.1.0"
edition = "2021"
description = "A Snagit-style screenshot tool for Windows, with a screenshot library and editor that also runs on Linux"
license = "MIT"

[build-dependencies]
embed-resource = "3"
png = "0.17"

[dependencies]
ab_glyph = "0.2"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.29", default-features = false, features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"

# Capture, tray, OCR, pinning and recording: Windows only.
[target.'cfg(windows)'.dependencies]
gif = "0.13"
png = "0.17"
windows = { version = "0.58", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "implement", "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Media_MediaFoundation"] }
windows-core = "0.58"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# The library and editor on Linux and other Unix desktops.
[target.'cfg(not(windows))'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
eframe = { version = "0.29", default-features = false, features = ["x11", "wayland"] }
libc = "0.2"
trash = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
