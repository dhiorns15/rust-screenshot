[package]
name = "rsnip"
version = "0.4.3"
edition = "2021"
description = "A Snagit-style screenshot tool for Windows, with a screenshot library and editor that also runs on Linux"
license = "MIT"

[features]
# Lets tools see and drive the library window: run a build with this feature with EGUI_INSPECTION=1
# and it serves its UI tree on localhost:5719 (see CONTRIBUTING.md). Never in releases.
inspect = ["eframe/inspection"]

[build-dependencies]
embed-resource = "3"
png = "0.17"

[dependencies]
ab_glyph = "0.2"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.36", default-features = false, features = ["serde"] }
egui-phosphor = "0.14"
gif = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"

# Capture, tray, OCR, pinning and recording: Windows only.
[target.'cfg(windows)'.dependencies]
png = "0.17"
sha2 = "0.10"
windows = { version = "0.58", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "implement", "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Media_MediaFoundation"] }
windows-core = "0.58"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# The library and editor on Linux and other Unix desktops.
[target.'cfg(not(windows))'.dependencies]
# The tray icon (StatusNotifierItem), without pulling in tokio.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
# The screen-cast portal and notifications, on the same D-Bus library as the tray icon.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
eframe = { version = "0.36", default-features = false, features = ["x11", "wayland"] }
libc = "0.2"
trash = "5"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
proptest = "1"

# Pixel snapshots render on a GPU, so they run on Linux with a software one (ci/Dockerfile).
[target.'cfg(target_os = "linux")'.dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "snapshot", "wgpu"] }

[profile.release]
lto = true
codegen-units = 1
# Keeps function names, so Linux crash reports have a backtrace (Windows keeps its symbols in a
# .pdb file, which the release workflow builds and publishes separately).
strip = "debuginfo"
